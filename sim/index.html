<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FPV PROJECT — 드론 시뮬레이터</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="sim.css" />
  <link rel="stylesheet" href="hangar.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <!-- 터치 가상 스틱 -->
  <div id="touch" hidden>
    <div class="tz tz-left"><div class="base"><div class="knob"></div></div></div>
    <div class="tz tz-right"><div class="base"><div class="knob"></div></div></div>
    <div class="tbtns top">
      <button data-act="pause">Ⅱ</button>
      <button data-act="camera">시점</button>
      <button data-act="modeNext">모드</button>
      <button data-act="reset">리셋</button>
      <button data-act="hud">HUD</button>
      <button data-act="score" class="b-score combat" hidden>점수</button>
    </div>
    <div class="tbtns fire combat" hidden>
      <button data-act="fire" class="b-fire">레이저</button>
    </div>
    <div class="tbtns aux combat" hidden>
      <button data-act="dodge" class="b-dodge">회피</button>
      <button data-act="missile" class="b-missile">미사일</button>
      <button data-act="item" class="b-item">아이템</button>
      <button data-act="itemNext" class="b-swap" hidden>⇄ 교체</button>
      <button data-act="skill" class="b-skill">스킬</button>
    </div>
  </div>

  <div id="ui"></div>
  <div id="loading" hidden><div class="spinner"></div><span>맵 생성 중…</span></div>
  <div id="fatal" hidden></div>

  <script>
    // 웹 주소 이전: 옛 주소(korprof270-jpg.github.io)로 들어오면 저장 기록을 들고 새 주소(fpvproject.github.io)로 옮긴다
    (function () {
      var NEW = "fpvproject.github.io", RE = /^(fpv|haneulgil|hgfpv)/, SKIP = /^hgfpv-mapthumb/;
      try {
        if (location.hostname === "korprof270-jpg.github.io") {
          var d = {};
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (RE.test(k) && !SKIP.test(k)) d[k] = localStorage.getItem(k); }
          var j = JSON.stringify(d), h = Object.keys(d).length && j.length < 1500000 ? "#mig=" + encodeURIComponent(btoa(unescape(encodeURIComponent(j)))) : "";
          location.replace("https://" + NEW + "/" + location.search + h);
          return;
        }
        if (location.hostname === NEW && location.hash.indexOf("#mig=") === 0) {
          var m = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(5))))));
          var has = false; for (var q = 0; q < localStorage.length; q++) if (RE.test(localStorage.key(q)) && !SKIP.test(localStorage.key(q))) has = true;
          if (!has) for (var key in m) localStorage.setItem(key, m[key]);   // 새 주소에 기록이 없을 때만 옮긴다
          history.replaceState(null, "", location.pathname + location.search);
        }
      } catch (e) { if (location.hostname === "korprof270-jpg.github.io") location.replace("https://" + NEW + "/"); }
    })();
    // 설치형 앱(PWA)·오프라인 실행용 서비스 워커 (지도 앱과 같은 것을 사용)
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
  </script>
  <script>
    // 시작 점검: 12초 안에 게임이 뜨지 않으면 원인(오류)과 "새로 받고 다시 시작" 버튼을 보여 준다
    (function () {
      var errs = (window.__bootErrs = []);
      window.addEventListener("error", function (e) { var t = e.target && e.target !== window && (e.target.src || e.target.href); errs.push(t ? "파일을 불러오지 못함: " + String(t).split("/").slice(-2).join("/") : (e.message || "오류") + (e.filename ? " (" + e.filename.split("/").slice(-2).join("/") + ":" + e.lineno + ")" : "")); }, true);
      window.addEventListener("unhandledrejection", function (e) { errs.push("오류: " + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () {
        if (window.__game) return;
        var d = document.createElement("div");
        d.style.cssText = "position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#060b16;color:#eafcff;font:14px/1.6 sans-serif;padding:20px";
        d.innerHTML = '<div style="max-width:520px"><b style="font-size:18px">게임을 시작하지 못했습니다</b><p>업데이트 직후 옛 파일이 섞였을 수 있습니다. 아래 버튼으로 파일을 새로 받아 다시 시작해 보세요.</p><pre style="white-space:pre-wrap;font-size:12px;color:#ff9a8a;max-height:30vh;overflow:auto">' + (errs.join("\n") || "오류 기록 없음 (불러오는 중 멈춤)").replace(/</g, "&lt;") + '<\/pre><button id="bootfix" style="font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#ff6a2a;color:#fff">새로 받고 다시 시작<\/button></div>';
        document.body.appendChild(d);
        document.getElementById("bootfix").onclick = function () {
          this.textContent = "받는 중…";
          var urls = performance.getEntriesByType("resource").map(function (r) { return r.name; }).filter(function (u) { return u.indexOf(location.origin) === 0 && /\.(js|css|png|json)(\?|$)/.test(u); });
          urls.push(location.href);
          Promise.all(urls.map(function (u) { return fetch(u, { cache: "reload" }).catch(function () {}); })).then(function () { location.reload(); });
        };
      }, 12000);
    })();
  </script>
  <script type="module">import("./js/main.js").catch(function (e) { window.__bootErrs && window.__bootErrs.push("시작 파일 오류: " + (e && (e.message || e)) + (e && e.stack ? "\n" + String(e.stack).split("\n").slice(0, 3).join("\n") : "")); console.error(e); window.__bootProbe && window.__bootProbe(); });
    // 시작 실패 원인 찾기: 시작 파일부터 import 를 따라가며 받아 보고, 못 받은 파일과 응답 코드를 적는다
    window.__bootProbe = function () {
      var seen = {}, q = [new URL("./js/main.js", location.href).href], bad = [], n = 0;
      function step() {
        if (!q.length || n > 400) { window.__bootErrs.push(bad.length ? "못 받은 파일: " + bad.slice(0, 6).join(", ") : "모든 파일을 받을 수 있음 (" + n + "개) — 파일 사이 내용이 서로 맞지 않는 문제"); var pre = document.querySelector("#bootfix") && document.querySelector("#bootfix").previousElementSibling; if (pre) pre.textContent = window.__bootErrs.join("\n"); return; }
        var u = q.shift(); if (seen[u]) return step(); seen[u] = 1; n++;
        fetch(u, { cache: "reload" }).then(function (r) {
          if (!r.ok) { bad.push(u.split("/").slice(-2).join("/") + " (" + r.status + ")"); return ""; }
          return r.text();
        }, function (er) { bad.push(u.split("/").slice(-2).join("/") + " (네트워크: " + (er && er.message) + ")"); return ""; }).then(function (t) {
          var re = /(?:^|[;\n}])\s*import\s+(?:[^"';]*?\s+from\s+)?["'](\.{1,2}\/[^"']+)["']/g, m;
          while ((m = re.exec(t))) q.push(new URL(m[1], u).href);
          step();
        });
      }
      step();
    };</script>
</body>
</html>
