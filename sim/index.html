<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FPV PROJECT — 드론 시뮬레이터</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="sim.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>

  <!-- 터치 가상 스틱 -->
  <div id="touch" hidden>
    <div class="tz tz-left"><div class="base"><div class="knob"></div></div></div>
    <div class="tz tz-right"><div class="base"><div class="knob"></div></div></div>
    <div class="tbtns top">
      <button data-act="pause">Ⅱ</button>
      <button data-act="camera">시점</button>
      <button data-act="modeNext">모드</button>
      <button data-act="reset">리셋</button>
      <button data-act="hud">HUD</button>
      <button data-act="score" class="b-score combat" hidden>점수</button>
    </div>
    <div class="tbtns fire combat" hidden>
      <button data-act="fire" class="b-fire">레이저</button>
    </div>
    <div class="tbtns aux combat" hidden>
      <button data-act="dodge" class="b-dodge">회피</button>
      <button data-act="missile" class="b-missile">미사일</button>
      <button data-act="item" class="b-item">아이템</button>
      <button data-act="itemNext" class="b-swap" hidden>⇄ 교체</button>
      <button data-act="skill" class="b-skill">스킬</button>
    </div>
  </div>

  <div id="ui"></div>
  <div id="loading" hidden><div class="spinner"></div><span>맵 생성 중…</span></div>
  <div id="fatal" hidden></div>

  <script>
    // 웹 주소 이전: 옛 주소(korprof270-jpg.github.io)로 들어오면 저장 기록을 들고 새 주소(fpvproject.github.io)로 옮긴다
    (function () {
      var NEW = "fpvproject.github.io", RE = /^(fpv|haneulgil|hgfpv)/, SKIP = /^hgfpv-mapthumb/;
      try {
        if (location.hostname === "korprof270-jpg.github.io") {
          var d = {};
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (RE.test(k) && !SKIP.test(k)) d[k] = localStorage.getItem(k); }
          var j = JSON.stringify(d), h = Object.keys(d).length && j.length < 1500000 ? "#mig=" + encodeURIComponent(btoa(unescape(encodeURIComponent(j)))) : "";
          location.replace("https://" + NEW + "/" + location.search + h);
          return;
        }
        if (location.hostname === NEW && location.hash.indexOf("#mig=") === 0) {
          var m = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(5))))));
          var has = false; for (var q = 0; q < localStorage.length; q++) if (RE.test(localStorage.key(q)) && !SKIP.test(localStorage.key(q))) has = true;
          if (!has) for (var key in m) localStorage.setItem(key, m[key]);   // 새 주소에 기록이 없을 때만 옮긴다
          history.replaceState(null, "", location.pathname + location.search);
        }
      } catch (e) { if (location.hostname === "korprof270-jpg.github.io") location.replace("https://" + NEW + "/"); }
    })();
    // 설치형 앱(PWA)·오프라인 실행용 서비스 워커 (지도 앱과 같은 것을 사용)
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
