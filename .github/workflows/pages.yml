# main 브랜치에 올리면 GitHub Pages로 자동 배포 (드론 공역 지도 + 드론 정비 시뮬레이터)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect static files
        run: |
          mkdir -p _site
          cp -r index.html styles.css manifest.webmanifest sw.js data js icons simulator _site/
          [ -d download ] && cp -r download _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
