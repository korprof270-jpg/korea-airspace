# 정적 사이트(공역 지도 + 드론 시뮬레이터)를 GitHub Pages 로 배포
# 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 설정해야 동작합니다.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포 파일 모으기
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js data js icons sim _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
